[project]
name = "topic_summary"
version = "0.1.0"
description = "topic_summary using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2"
]

[project.scripts]
topic_summary = "topic_summary.main:run"
run_crew = "topic_summary.main:run"
train = "topic_summary.main:train"
replay = "topic_summary.main:replay"
test = "topic_summary.main:test"
run_with_trigger = "topic_summary.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
